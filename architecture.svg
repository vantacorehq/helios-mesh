<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="500" fill="#0d1330"/><text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Helios-Mesh architecture layers</text><rect x="60" y="60" width="680" height="62" rx="10" fill="#6b46c1"/><text x="80" y="88" font-size="15" font-weight="700" fill="#fff">L5 · Applications</text><text x="80" y="110" font-size="13" fill="#fff" opacity=".85">knowledge archives, maps, messaging, name directory, AI inference</text><rect x="60" y="132" width="680" height="62" rx="10" fill="#2b6cb0"/><text x="80" y="160" font-size="15" font-weight="700" fill="#fff">L4 · Data</text><text x="80" y="182" font-size="13" fill="#fff" opacity=".85">content addressing (CID), erasure coding 8+4, DTN delivery, CRDT metadata</text><rect x="60" y="204" width="680" height="62" rx="10" fill="#2c7a7b"/><text x="80" y="232" font-size="15" font-weight="700" fill="#fff">L3 · Routing</text><text x="80" y="254" font-size="13" fill="#fff" opacity=".85">energy-aware mesh, store-and-forward, radio channel selection</text><rect x="60" y="276" width="680" height="62" rx="10" fill="#b7791f"/><text x="80" y="304" font-size="15" font-weight="700" fill="#fff">L2 · Radio links</text><text x="80" y="326" font-size="13" fill="#fff" opacity=".85">LoRa 868/915 MHz · HF 3–30 MHz · VHF/UHF · LEO satellites · optical</text><rect x="60" y="348" width="680" height="62" rx="10" fill="#9c4221"/><text x="80" y="376" font-size="15" font-weight="700" fill="#fff">L1 · Navigation and time</text><text x="80" y="398" font-size="13" fill="#fff" opacity=".85">star tracker, IMU, optional GNSS, RTC holdover</text><rect x="60" y="420" width="680" height="62" rx="10" fill="#2f855a"/><text x="80" y="448" font-size="15" font-weight="700" fill="#fff">L0 · Power and hardware</text><text x="80" y="470" font-size="13" fill="#fff" opacity=".85">solar panels, MPPT, LiFePO4, SBC/NVMe, thermal control</text></svg>